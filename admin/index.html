<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dashboard - Admin GRRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>

  <!-- LAYAR 1: CEK LOGIN -->
  <div id="loadingScreen" class="admin-login">
    <div class="admin-login-card">
      <p>Memeriksa status login…</p>
    </div>
  </div>

  <!-- LAYAR 2: LOGIN -->
  <div id="loginScreen" class="admin-login hidden">
    <div class="admin-login-card">
      <img src="../assets/images/logo-grrm.png" alt="GRRM" class="logo" />
      <h1>Admin Panel GRRM</h1>
      <p>Login dengan akun Google Anda untuk mengelola konten.</p>
      <a href="/api/auth/login" class="btn btn-google" id="loginBtn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
          <path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
          <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
          <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
        </svg>
        Login dengan Google
      </a>
    </div>
  </div>

  <!-- LAYAR 3: DASHBOARD -->
  <div id="dashboardScreen" class="hidden">

    <header class="admin-header">
      <div class="admin-brand">
        <img src="../assets/images/logo-grrm.png" alt="GRRM" />
        <span>GRRM</span>
        <span class="admin-tag">Panel</span>
      </div>
      <div class="admin-header-right">
        <span class="admin-user-email" id="userInfo"></span>
        <a href="../index.html" target="_blank" class="btn btn-outline btn-sm">Lihat Website</a>
        <button type="button" class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
      </div>
    </header>

    <main class="admin-main">
      
      <!-- Header Halaman -->
      <div class="dash-header">
        <div>
          <h1>Selamat Datang, Admin</h1>
          <p>Kelola konten website GRRM dengan mudah di sini.</p>
        </div>
        <a href="editor.html" class="btn btn-primary btn-lg">+ Buat Konten Baru</a>
      </div>

      <!-- Navigasi Tab -->
      <div class="tabs-container">
        <button class="tab-btn active" data-tab="berita">Berita & Artikel</button>
        <button class="tab-btn" data-tab="galeri">Album Galeri</button>
        <button class="tab-btn" data-tab="pengumuman">Pengumuman</button>
      </div>

      <!-- Konten Tab -->
      <div class="tab-content">
        <!-- TAB BERITA -->
        <div id="tab-berita" class="tab-pane active">
          <div class="admin-card">
            <div id="beritaContainer" class="posts-list"><div class="admin-loading">Memuat berita...</div></div>
          </div>
        </div>

        <!-- TAB GALERI -->
        <div id="tab-galeri" class="tab-pane hidden">
          <div class="admin-card">
            <div id="galeriContainer" class="posts-list"><div class="admin-loading">Memuat galeri...</div></div>
          </div>
        </div>

        <!-- TAB PENGUMUMAN -->
        <div id="tab-pengumuman" class="tab-pane hidden">
          <div class="admin-card">
            <div id="pengumumanContainer" class="posts-list"><div class="admin-loading">Memuat pengumuman...</div></div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="../assets/js/admin-common.js"></script>
  <script src="../assets/js/admin-dashboard.js"></script>
</body>
</html>
