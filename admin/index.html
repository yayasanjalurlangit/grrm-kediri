<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dashboard - Admin GRRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>

  <!-- LOADING SCREEN -->
  <div id="loadingScreen" class="admin-login">
    <div class="admin-login-card">
      <p>Memeriksa status login…</p>
    </div>
  </div>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="admin-login hidden">
    <div class="admin-login-card">
      <img src="../assets/images/logo-grrm.png" alt="GRRM" class="logo" />
      <h1>Admin Panel GRRM</h1>
      <p>Login dengan akun Google Anda untuk mengelola konten.</p>
      <a href="/api/auth/login" class="btn btn-google" id="loginBtn">Login dengan Google</a>
    </div>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div id="dashboardScreen" class="hidden">
    <header class="admin-header">
      <div class="admin-brand">
        <img src="../assets/images/logo-grrm.png" alt="GRRM" />
        <span>GRRM</span>
        <span class="admin-tag">Panel</span>
      </div>
      <div class="admin-header-right">
        <span class="admin-user-email" id="userInfo"></span>
        <a href="../index.html" target="_blank" class="btn btn-outline btn-sm">Lihat Website</a>
        <button type="button" class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
      </div>
    </header>

    <main class="admin-main">
      <div class="dash-header">
        <div>
          <h1>Selamat Datang, Admin</h1>
          <p>Kelola konten website GRRM dengan mudah di sini.</p>
        </div>
        <a href="editor.html" id="btnCreateNew" class="btn btn-primary btn-lg">+ Buat Konten Baru</a>
      </div>

      <div class="tabs-container">
        <button class="tab-btn active" data-tab="berita">Berita & Artikel</button>
        <button class="tab-btn" data-tab="galeri">Album Galeri</button>
        <button class="tab-btn" data-tab="pengumuman">Pengumuman</button>
      </div>

      <div class="tab-content">
        <div id="tab-berita" class="tab-pane">
          <div class="admin-card">
            <div id="beritaContainer" class="posts-list"><div class="admin-empty"><p>Memuat berita...</p></div></div>
          </div>
        </div>
        <div id="tab-galeri" class="tab-pane hidden">
          <div class="admin-card">
            <div id="galeriContainer" class="posts-list"><div class="admin-empty"><p>Memuat galeri...</p></div></div>
          </div>
        </div>
        <div id="tab-pengumuman" class="tab-pane hidden">
          <div class="admin-card">
            <div id="pengumumanContainer" class="posts-list"><div class="admin-empty"><p>Memuat pengumuman...</p></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="adminToast" class="admin-toast"></div>

  <script src="../assets/js/admin-common.js"></script>
  <script src="../assets/js/admin-dashboard.js"></script>
</body>
</html>
