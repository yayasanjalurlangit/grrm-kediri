<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memuat Artikel... — GRRM Kediri</title>
<link rel="icon" href="assets/img/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="article-single">

<div id="header-placeholder"></div>

<!-- Konten Utama -->
<div class="container" id="pageContent" style="display: none;">
  <div class="article-single__layout">
    
    <!-- Kolom Kiri: Artikel -->
    <main class="article-main">
      <header class="article-header">
        <div class="article-breadcrumb">
          Beranda / <span id="articleCategory">Berita</span>
        </div>
        <h1 class="article-title" id="articleTitle"></h1>
        <div class="article-meta">
          <span class="article-meta__author">Admin GRRM</span>
          <span class="article-meta__divider"></span>
          <span id="articleDate"></span>
        </div>
      </header>

      <div class="article-image-wrapper" id="articleImageWrapper" style="display: none;">
        <img id="articleImage" class="article-image" src="" alt="">
        <div class="article-caption" id="articleCaption"></div>
      </div>

      <div class="post-content" id="articleBody"></div>

      <div style="margin-top: 50px; border-top: 1px solid var(--line); padding-top: 30px;">
        <a href="artikel.html" class="btn btn--primary">← Kembali ke Daftar Artikel</a>
      </div>
    </main>

    <!-- Kolom Kanan: Sidebar -->
    <aside class="sidebar">
      <!-- Widget Share -->
      <div class="widget">
        <h4 class="widget-title">Bagikan Artikel</h4>
        <div class="share-buttons">
          <a href="#" id="shareWA" class="share-btn share-btn--wa" title="WhatsApp">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.031 2C6.5 2 2 6.5 2 12.031c0 1.77.46 3.43 1.26 4.88L2 22l5.23-1.37a9.97 9.97 0 004.8 1.22c5.53 0 10.03-4.5 10.03-10.03S17.56 2 12.031 2zm5.55 14.23c-.23.65-1.34 1.25-1.86 1.32-.53.07-1.03.26-3.36-.7-2.8-1.14-4.56-4.1-4.7-4.3-.14-.2-1.1-1.45-1.1-2.78 0-1.32.68-1.98.93-2.24.25-.26.55-.33.73-.33.18 0 .37.01.53.02.17.01.4-.06.62.48.23.56.78 1.9.85 2.04.07.14.11.31.02.49-.09.18-.18.3-.35.5-.18.2-.37.44-.53.63-.18.2-.37.42-.18.76.18.34.8 1.34 1.72 2.16 1.18 1.05 2.17 1.38 2.5 1.52.34.14.54.12.73-.07.2-.18.86-1 1.1-1.34.24-.34.48-.28.8-.17.32.11 2.04 1 2.39 1.18.35.18.58.27.66.42.08.15.08.88-.15 1.53z"/></svg>
          </a>
          <a href="#" id="shareFB" class="share-btn share-btn--fb" title="Facebook">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 10-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.7l-.4 2.9h-2.3v7A10 10 0 0022 12z"/></svg>
          </a>
          <button id="shareCopy" class="share-btn share-btn--copy" title="Salin Link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
          </button>
        </div>
      </div>

      <!-- Widget Penulis -->
      <div class="widget">
        <h4 class="widget-title">Tentang Penulis</h4>
        <div class="author-widget">
          <img src="assets/img/logo-grrm.webp" alt="Admin">
          <div class="author-widget__info">
            <strong>Admin GRRM</strong>
            <span>Yayasan Jalur Langit Kediri</span>
          </div>
        </div>
      </div>
        <!-- TAMBAHKAN WIDGET INI UNTUK ARTIKEL TERKAIT -->
        <div class="widget" id="relatedWidget" style="display: none;">
        <h4 class="widget-title">Artikel Terbaru</h4>
        <div class="related-list" id="relatedList">
        </div>
      </div>
    </aside>

  </div>
</div>

<!-- Loading State -->
<div class="container" style="padding: 100px 0; min-height: 60vh;" id="loadingSkeleton">
  <div class="skeleton" style="height: 40px; width: 70%; margin-bottom: 20px;"></div>
  <div class="skeleton" style="height: 20px; width: 30%; margin-bottom: 40px;"></div>
  <div class="skeleton" style="height: 400px; border-radius: 8px; margin-bottom: 40px;"></div>
</div>

<!-- Error State -->
<div class="container" id="errorMessage" style="display: none; padding: 100px 0; text-align: center;">
  <h2 style="font-size: 2rem; color: var(--purple-800);">Oops! Artikel tidak ditemukan.</h2>
  <p style="color: var(--muted); margin: 10px 0 20px;">Pastikan URL sudah benar atau artikel telah dihapus.</p>
  <a href="artikel.html" class="btn btn--primary">Kembali ke Artikel</a>
</div>

<div id="footer-placeholder"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/blogger.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/artikel-detail.js"></script>
</body>
</html>
