<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body class="ui-balanced">

<div id="header-placeholder"></div>

  <section class="page-hero">
    <div class="container">
      <h1>Kontak</h1>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span aria-hidden="true">›</span>
        <span aria-current="page">Kontak</span>
      </nav>
    </div>
  </section>

  <main id="main" class="section">
    <div class="container">

      <div class="section-header section-header-left">
        <h2>Hubungi Kami</h2>
        <p class="section-desc">Pilih saluran yang paling nyaman.</p>
      </div>

      <div class="kontak-grid">

               <div class="kontak-info">

          <div class="kontak-item">
            <div class="icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div>
              <h4>Alamat</h4>
              <p>Jl. Contoh No. 123, Kediri, Jawa Timur 64100</p>
            </div>
          </div>

          <div class="kontak-item">
            <div class="icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
            </div>
            <div>
              <h4>Email</h4>
              <p><a href="mailto:info@grrm.id">info@grrm.id</a></p>
            </div>
          </div>

          <div class="kontak-item">
            <div class="icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </div>
            <div>
              <h4>Telepon / WA</h4>
              <p><a href="tel:+6281234567890">+62 812-3456-7890</a></p>
            </div>
          </div>

          <div class="kontak-item">
            <div class="icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            </div>
            <div>
              <h4>Media Sosial</h4>
              <p>
                <a href="#">Instagram</a> ·
                <a href="#">Facebook</a> ·
                <a href="#">YouTube</a>
              </p>
            </div>
          </div>

        </div>

        <form class="kontak-form" onsubmit="event.preventDefault(); alert('Pesan terkirim (demo).');">
          <h3>Kirim Pesan</h3>

          <div class="form-group">
            <label for="nama">Nama</label>
            <input type="text" id="nama" name="nama" class="form-control" placeholder="Nama Anda" required autocomplete="name" />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="email@contoh.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="pesan">Pesan</label>
            <textarea id="pesan" name="pesan" class="form-control" placeholder="Tulis pesan Anda..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Kirim</button>
        </form>

      </div>

      <section class="map-wrap">
        <h3 class="map-title">Lokasi Sekretariat</h3>
        <div class="map-placeholder">Peta Lokasi (Google Maps)</div>
      </section>

    </div>
  </main>

  <div id="footer-placeholder"></div>
  
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
