# =========================================================
# GRRM - Cloudflare Pages Config
# =========================================================

name = "grrm-website"
compatibility_date = "2024-10-01"
pages_build_output_dir = "."

# Environment variables non-secret (boleh public)
[vars]
SITE_NAME = "GRRM"
SITE_URL = "https://grrm-kediri.pages.dev"
BLOGGER_API_BASE = "https://www.googleapis.com/blogger/v3"

# Untuk production, secret diset via Cloudflare Dashboard,
# bukan di file ini (lebih aman).

compatibility_flags = ["nodejs_compat"]